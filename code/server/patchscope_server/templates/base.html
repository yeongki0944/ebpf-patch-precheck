<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}PatchScope{% endblock %} · PatchScope</title>
<link rel="stylesheet" href="/static/app.css">
{% block head %}{% endblock %}
</head>
<body>
<a class="skip" href="#main">본문으로 건너뛰기</a>
<header class="topbar">
  <a class="logo" href="/" style="color:#fff">PatchScope</a>
  {% if user %}
  <nav aria-label="주 메뉴"><a href="/" {% if nav == 'dash' %}aria-current="page"{% endif %}>서버 목록</a></nav>
  <div class="right">
    <span>시간대 {{ tz }} · <a href="/tz/{{ 'UTC' if tz == 'KST' else 'KST' }}">{{ 'UTC' if tz == 'KST' else 'KST' }}로 보기</a></span>
    <form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button type="submit">로그아웃</button></form>
  </div>
  {% endif %}
</header>
<main id="main">
{% block body %}{% endblock %}
</main>
<script src="/static/app.js" defer></script>
</body>
</html>
